<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="/images/playfavi.png" type="image/png">
</head>
<body>
    <div class="player">
        <h4 class="title-playlist">Playlist</h4>
        <img alt="Music cover" id="cover" class="cover">
        <audio id="audio"></audio>
        <div class="below-cover">
            <div class="song-info">
                <div id="song-name" class="title-song">Nome da música</div>
                <button id="singer" class="singer-name light-color">Artista</button>
            </div>
            <button class="like button light-color"><i class="bi bi-heart"></i></button>
        </div>
        <div id="progress-container" class="progress-container">
            <div class="progress-bar">
                <div id = "current-progress" class="current-progress"></div>
            </div>
        </div>
        <div class="button-container">
            <button id="shuffle" class="button"><i class="bi bi-shuffle"></i></button>
            <button id="previous" class="button button-navigate"><i class="bi bi-skip-start-fill"></i></button>
            <button id="play" class="button button-biggest"><i class="bi bi-play-circle-fill"></i></button>
            <button id="next" class="button button-navigate"><i class="bi bi-skip-end-fill"></i></button>
            <button id="repeat" class="button"><i class="bi bi-repeat"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
